  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_remote_config: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter




  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true



  # Register your asset folder here
  assets:
    - assets/qrcode.jpg
    - assets/gamming.jpg
    - assets/Savann.jpg
    - assets/fonts/
    - assets/logo.png


  fonts:
    - family: KhmerOSBattambang
      fonts:
        - asset: assets/fonts/KhmerOSbattambang.ttf
    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro-Regular.ttf
        - asset: assets/fonts/KhmerOS.ttf
        - asset: assets/fonts/Battambang-Regular.ttf
    - family: Battambang
      fonts:
        - asset: assets/fonts/Battambang-Regular.ttf



