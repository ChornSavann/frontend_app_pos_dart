  http: ^1.2.0
  top_snackbar_flutter: ^3.1.0
  flutter_local_notifications: ^17.0.0
  mobile_scanner: ^5.2.3
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5

  google_sign_in: ^6.2.1
  google_fonts: ^6.1.0
  carousel_slider: ^5.0.0
  share_plus: ^10.1.0
  url_launcher: ^6.3.0
  get: ^4.7.3
  get_x: ^5.0.0
  barcode: ^2.2.4
  pdf: ^3.10.4
  path_provider: ^2.1.4
  printing: ^5.11.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2
